apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ir
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`longhorn.stonehold.local`)
      services:
        - name: longhorn-frontend
          namespace: longhorn-system
          kind: Service
          port: 80
  tls: {}
