apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
helmCharts:
  - name: longhorn
    includeCRDs: true
    releaseName: longhorn
    namespace: longhorn-system
    # the version of chart not the appVersion
    version: 1.13.0
    repo: https://charts.longhorn.io
    # chart requires kubeVersion >=1.34; helm template would otherwise use its built-in default
    kubeVersion: "1.35.6"
    valuesMerge: merge
    valuesFile: values.yaml
