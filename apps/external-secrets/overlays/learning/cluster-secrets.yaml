apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: microk8s-cluster-secret-store
spec:
  provider:
    azurekv:
      tenantId: "f59e04e1-9845-49bd-a130-2bc27a396a1a"
      vaultUrl: "https://kv-microk8s.vault.azure.net"
      authSecretRef:
        clientId:
          name: es-service-principal-secret
          namespace: external-secrets
          key: client-id
        clientSecret:
          name: es-service-principal-secret
          namespace: external-secrets
          key: client-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cluster-ps
spec:
  updatePolicy: Replace # Policy to overwrite existing secrets in the provider on sync
  # https://external-secrets.io/latest/guides/ownership-deletion-policy/#retain-default
  deletionPolicy: None
  refreshInterval: 1m # Refresh interval for which push secret will reconcile
  secretStoreRefs: # A list of secret stores to push secrets to
    - name: microk8s-cluster-secret-store
      kind: ClusterSecretStore
  selector:
    secret:
      name: es-service-principal-secret # Source Kubernetes secret used by AD Service Principal to be pushed to Azure Key Vault
  data:
    - match:
        secretKey: client-id
        remoteRef:
          remoteKey: microk8s-client-id
    - match:
        secretKey: client-secret
        remoteRef:
          remoteKey: microk8s-client-secret
---
# It will create azure-service-principal-secret in selected namespaces with credentials of service principal
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: azure-service-principal-ces
spec:
  externalSecretName: azure-service-principal-es
  namespaceSelectors:
    - matchLabels:
        # all namespaces created by ArgoCD have such label
        # app.kubernetes.io/instance: cluster-resources-in-cluster
        stonehold/allowed-to-deploy-cluster-secrets: "true"
  refreshTime: 1m
  externalSecretSpec:
    secretStoreRef:
      name: microk8s-cluster-secret-store
      kind: ClusterSecretStore
    refreshInterval: 1m
    target:
      name: azure-service-principal-secret
      template:
        metadata:
          labels:
            managed-by: external-secrets
            app.kubernetes.io/instance: microk8s-external-secrets
    data:
      - secretKey: client-id
        remoteRef:
          key: microk8s-client-id
      - secretKey: client-secret
        remoteRef:
          key: microk8s-client-secret