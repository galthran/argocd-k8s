apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: microk8s-cluster-secret-store
spec:
  provider:
    azurekv:
      tenantId: "ab333b42-355d-42c6-81a9-abd641e6c243"
      vaultUrl: "https://kv-microk8s.vault.azure.net"
      authSecretRef:
        clientId:
          name: es-service-principal-secret
          namespace: external-secrets
          key: client-id
        clientSecret:
          name: es-service-principal-secret
          namespace: external-secrets
          key: client-secret
---

