apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: microk8s-cluster-secret-store
spec:
  provider:
    azurekv:
      tenantId: "ab333b42-355d-42c6-81a9-abd641e6c243"
      vaultUrl: "https://kv-microk8s.vault.azure.net"
      authSecretRef:
        clientId:
          name: es-service-principal-secret
          namespace: external-secrets
          key: client-id
        clientSecret:
          name: es-service-principal-secret
          namespace: external-secrets
          key: client-secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cluster-ps
spec:
  updatePolicy: Replace # Policy to overwrite existing secrets in the provider on sync
  # https://external-secrets.io/latest/guides/ownership-deletion-policy/#retain-default
  deletionPolicy: None
  refreshInterval: 1m # Refresh interval for which push secret will reconcile
  secretStoreRefs: # A list of secret stores to push secrets to
    - name: microk8s-cluster-secret-store
      kind: ClusterSecretStore
  selector:
    secret:
      name: es-service-principal-secret # Source Kubernetes secret used by AD Service Principal to be pushed to Azure Key Vault
  data:
    - match:
        secretKey: client-id
        remoteRef:
          remoteKey: microk8s-client-id
    - match:
        secretKey: client-secret
        remoteRef:
          remoteKey: microk8s-client-secret