apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adminer-ir
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`adminer.stonehold.local`)
      services:
        - name: adminer
          namespace: adminer
          kind: Service
          port: 8080